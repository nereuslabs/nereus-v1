<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Nereus 2.0 Pixel Art: Compass Helm (The Navigator) -->
  <defs>
    <filter id="helm-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="#00f5d4" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
  </defs>

  <!-- Dark Canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect width="506" height="506" x="3" y="3" rx="105" fill="none" stroke="#1b2537" stroke-width="3"/>

  <!-- 32x32 Grid centered (scale: 11px per pixel, offset x=80, y=80) -->
  <g transform="translate(80, 80)" shape-rendering="crispEdges" filter="url(#helm-glow)">
    <!-- Palette:
         Spoke/Handle: #F39C12
         Wheel Rim:    #00BBF9
         Compass Star: #00F5D4
         Core Center:  #FFFFFF
         Deep Accents: #1B2537 & #4361EE
    -->

    <!-- Top Spoke / Handle -->
    <rect x="165" y="11" width="22" height="44" fill="#F39C12"/>
    <rect x="154" y="0" width="44" height="22" fill="#00F5D4"/>

    <!-- Bottom Spoke / Handle -->
    <rect x="165" y="297" width="22" height="44" fill="#F39C12"/>
    <rect x="154" y="330" width="44" height="22" fill="#00BBF9"/>

    <!-- Left Spoke / Handle -->
    <rect x="11" y="165" width="44" height="22" fill="#F39C12"/>
    <rect x="0" y="154" width="22" height="44" fill="#00BBF9"/>

    <!-- Right Spoke / Handle -->
    <rect x="297" y="165" width="44" height="22" fill="#F39C12"/>
    <rect x="330" y="154" width="22" height="44" fill="#00BBF9"/>

    <!-- Diagonal Handles (4 corners) -->
    <rect x="44" y="44" width="33" height="33" fill="#F39C12"/>
    <rect x="275" y="44" width="33" height="33" fill="#F39C12"/>
    <rect x="44" y="275" width="33" height="33" fill="#F39C12"/>
    <rect x="275" y="275" width="33" height="33" fill="#F39C12"/>

    <!-- Outer Circular Rim (Pixelated Circle) -->
    <rect x="110" y="55" width="132" height="22" fill="#00BBF9"/>
    <rect x="110" y="275" width="132" height="22" fill="#00BBF9"/>
    <rect x="55" y="110" width="22" height="132" fill="#00BBF9"/>
    <rect x="275" y="110" width="22" height="132" fill="#00BBF9"/>

    <!-- Corner arcs of rim -->
    <rect x="77" y="77" width="44" height="33" fill="#00BBF9"/>
    <rect x="231" y="77" width="44" height="33" fill="#00BBF9"/>
    <rect x="77" y="242" width="44" height="33" fill="#00BBF9"/>
    <rect x="231" y="242" width="44" height="33" fill="#00BBF9"/>

    <!-- Inner Spokes connecting to hub -->
    <rect x="165" y="77" width="22" height="77" fill="#4361EE"/>
    <rect x="165" y="198" width="22" height="77" fill="#4361EE"/>
    <rect x="77" y="165" width="77" height="22" fill="#4361EE"/>
    <rect x="198" y="165" width="77" height="22" fill="#4361EE"/>

    <!-- Central Compass Star (The Guide) -->
    <!-- North Pointer (Cyan / Neon) -->
    <polygon points="176,88 165,165 187,165" fill="#00F5D4"/>
    <polygon points="176,88 176,165 187,165" fill="#FFFFFF"/>

    <!-- South Pointer -->
    <polygon points="176,264 165,187 187,187" fill="#4361EE"/>

    <!-- West & East Pointers -->
    <polygon points="88,176 165,165 165,187" fill="#00BBF9"/>
    <polygon points="264,176 187,165 187,187" fill="#00BBF9"/>

    <!-- Glowing Center Hub (Terminal Command Prompt `>`) -->
    <rect x="154" y="154" width="44" height="44" fill="#0B0F19"/>
    <rect x="158" y="158" width="36" height="36" fill="#1B2537"/>
    <!-- Terminal '>' symbol in center -->
    <rect x="165" y="165" width="6" height="6" fill="#00F5D4"/>
    <rect x="171" y="171" width="8" height="6" fill="#00F5D4"/>
    <rect x="165" y="177" width="6" height="6" fill="#00F5D4"/>
  </g>
</svg>
